name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest -q
      - run: python -m scripts.self_check
        env:
          BOT_TOKEN: dummy
          DATABASE_PATH: ./data/selfcheck.db
      - name: Reject committed Telegram bot tokens
        run: |
          if git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{30,}'; then
            echo 'A value matching a Telegram bot token was committed.' >&2
            exit 1
          fi
