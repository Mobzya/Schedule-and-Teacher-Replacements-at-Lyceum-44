services:
  - type: web
    name: lyceum44-schedule-bot-v3
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TIMEZONE
        value: Europe/Moscow
      - key: ACADEMIC_YEAR
        value: 2026-2027
      - key: DATABASE_PATH
        value: /var/data/schedule_v3.db
      - key: SOURCE_SYNC_MINUTES
        value: 10
    disk:
      name: schedule-data
      mountPath: /var/data
      sizeGB: 1
